services:
  # ============================================
  # KAFKA 3.7.0 (KRaft mode - sin Zookeeper)
  # Imagen oficial: apache/kafka:3.7.0
  # ============================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    user: root
    ports:
      - "9092:9092"    # Para conexiones desde el HOST (producer.py, etc.)
      - "9093:9093"    # Para conexiones internas entre contenedores
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listeners - 3 listeners para distintos contextos
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster ID (generado, puedes cambiarlo)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # Topic defaults (como en el lab: 1 particion, replication 1)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1

      # Log config
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - lab-network

  # ============================================
  # KAFKA INIT - Crea el topic "weather-data"
  # Se ejecuta una vez y termina
  # ============================================
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo '>>> Creando topic weather-data...'
        /opt/kafka/bin/kafka-topics.sh --create --topic weather-data --bootstrap-server kafka:9093 --partitions 1 --replication-factor 1 --if-not-exists
        echo '>>> Topics existentes:'
        /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9093
        echo '>>> Topic weather-data creado exitosamente!'
    networks:
      - lab-network

  # ============================================
  # SPARK MASTER 3.5.3 (Python3, Scala 2.12, Hadoop 3)
  # Imagen oficial Apache: apache/spark:3.5.3-python3
  # ============================================
  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"    # Spark Master Web UI
      - "7077:7077"    # Spark Master port
      - "4040:4040"    # Spark Application UI
    environment:
      - SPARK_MODE=master
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/sbin/start-master.sh
    volumes:
      - ./scripts:/opt/spark-scripts
      - spark-ivy-cache:/root/.ivy2
    networks:
      - lab-network

  # ============================================
  # SPARK WORKER
  # ============================================
  spark-worker:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    volumes:
      - ./scripts:/opt/spark-scripts
      - spark-ivy-cache:/root/.ivy2
    networks:
      - lab-network

  # ============================================
  # KAFKA UI (Opcional - para visualizar topics/mensajes)
  # Accede en http://localhost:8090
  # ============================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lab-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - lab-network

volumes:
  kafka-data:
    driver: local
  spark-ivy-cache:
    driver: local

networks:
  lab-network:
    driver: bridge
